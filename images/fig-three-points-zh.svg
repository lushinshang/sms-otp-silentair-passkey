<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-labelledby="t d" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title id="t">簡訊驗證碼被讀走的三個地方</title><desc id="d">流程：網站寄出驗證碼，經過電信網路、電信櫃檯、你的手機三個地方，最後你才看到驗證碼。電信網路可能被假的位置更新把簡訊改道；電信櫃檯可能被冒名換發 SIM 卡；你的手機可能被詐騙 App 讀簡訊或通知。三個地方都不需要你開口。</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs><rect width="880" height="300" rx="14" fill="#f6f3ee"/>
<rect x="10" y="61" width="140" height="68" rx="10" fill="#ffffff" stroke="#5b6470"/>
<text x="80" y="101" font-size="18" fill="#1f2328" text-anchor="middle">網站寄出驗證碼</text>
<rect x="182" y="61" width="160" height="68" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="262" y="102" font-size="23" font-weight="700" fill="#b3261e" text-anchor="middle">電信網路</text>
<text x="262" y="169" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="262" dy="0">假的位置更新，</tspan><tspan x="262" dy="26">簡訊改道</tspan></text>
<rect x="365" y="61" width="160" height="68" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="445" y="102" font-size="23" font-weight="700" fill="#b3261e" text-anchor="middle">電信櫃檯</text>
<text x="445" y="169" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="445" dy="0">冒名換發 SIM 卡</tspan></text>
<rect x="548" y="61" width="160" height="68" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="628" y="102" font-size="23" font-weight="700" fill="#b3261e" text-anchor="middle">你的手機</text>
<text x="628" y="169" font-size="19" fill="#1f2328" text-anchor="middle"><tspan x="628" dy="0">詐騙 App </tspan><tspan x="628" dy="26">讀簡訊或通知</tspan></text>
<rect x="730" y="61" width="140" height="68" rx="10" fill="#ffffff" stroke="#5b6470"/>
<text x="800" y="101" font-size="18" fill="#1f2328" text-anchor="middle">你看到驗證碼</text>
<line x1="150" y1="95" x2="180" y2="95" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="342" y1="95" x2="363" y2="95" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="525" y1="95" x2="546" y2="95" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="708" y1="95" x2="728" y2="95" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="440.0" y="262" font-size="24" font-weight="700" fill="#1f2328" text-anchor="middle">三個地方，都不需要你開口</text>
</svg>