<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 442" role="img" aria-labelledby="t d" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="t">假的位置更新怎麼把簡訊改道</title><desc id="d">上排平常：網站寄出驗證碼，電信網路查這支手機在哪，送到你的手機。下排被攔截時：被入侵的電信設備送出假的位置更新，網路以為手機換了地方，簡訊改送攻擊者控制的路徑。結論：不需要碰到你的手機，被改的是電信網路裡的紀錄。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs>
<rect width="880" height="442" rx="14" fill="#f6f3ee"/>
<text x="30.0" y="48" font-size="22" font-weight="700" fill="#5b6470">平常</text>
<rect x="30.0" y="64" width="240" height="104" rx="12" fill="#ffffff" stroke="#5b6470" stroke-width="2.5"/>
<text x="150.0" y="123.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="150.0" dy="0">網站寄出驗證碼</tspan></text>
<line x1="274.0" y1="116.0" x2="316.0" y2="116.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="320.0" y="64" width="240" height="104" rx="12" fill="#ffffff" stroke="#5b6470" stroke-width="2.5"/>
<text x="440.0" y="110.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="440.0" dy="0">電信網路查</tspan><tspan x="440.0" dy="26.0">這支手機在哪</tspan></text>
<line x1="564.0" y1="116.0" x2="606.0" y2="116.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="610.0" y="64" width="240" height="104" rx="12" fill="#ffffff" stroke="#5b6470" stroke-width="2.5"/>
<text x="730.0" y="123.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="730.0" dy="0">送到你的手機</tspan></text>
<text x="30.0" y="222" font-size="22" font-weight="700" fill="#b3261e">被攔截時</text>
<rect x="30.0" y="238" width="240" height="104" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="150.0" y="284.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="150.0" dy="0">被入侵的電信設備</tspan><tspan x="150.0" dy="26.0">送出假的位置更新</tspan></text>
<line x1="274.0" y1="290.0" x2="316.0" y2="290.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="320.0" y="238" width="240" height="104" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="440.0" y="297.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="440.0" dy="0">網路以為手機換了地方</tspan></text>
<line x1="564.0" y1="290.0" x2="606.0" y2="290.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="610.0" y="238" width="240" height="104" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="730.0" y="284.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="730.0" dy="0">簡訊改送</tspan><tspan x="730.0" dy="26.0">攻擊者控制的路徑</tspan></text>
<text x="440.0" y="406" font-size="23" font-weight="700" fill="#1f2328" text-anchor="middle">不需要碰到你的手機，被改的是電信網路裡的紀錄</text>
</svg>