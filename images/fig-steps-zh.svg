<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 382" role="img" aria-labelledby="t d" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="t">今天就換：重要帳號怎麼換</title><desc id="d">第一排：打開最重要的帳號，例如信箱和交易所；到安全設定找通行密鑰；有就加通行密鑰，沒有就加驗證器。第二排：先備好其他登入方式；再關掉簡訊驗證；最後確認帳號救援是否還寄到簡訊。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs>
<rect width="880" height="382" rx="14" fill="#f6f3ee"/>
<text x="30.0" y="48" font-size="22" font-weight="700" fill="#1f5f99">先加新的</text>
<rect x="30.0" y="64" width="240" height="104" rx="12" fill="#ffffff" stroke="#1f5f99" stroke-width="2.5"/>
<text x="150.0" y="110.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="150.0" dy="0">打開最重要的帳號，</tspan><tspan x="150.0" dy="26.0">例如信箱和交易所</tspan></text>
<line x1="274.0" y1="116.0" x2="316.0" y2="116.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="320.0" y="64" width="240" height="104" rx="12" fill="#ffffff" stroke="#1f5f99" stroke-width="2.5"/>
<text x="440.0" y="110.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="440.0" dy="0">到安全設定</tspan><tspan x="440.0" dy="26.0">找通行密鑰</tspan></text>
<line x1="564.0" y1="116.0" x2="606.0" y2="116.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="610.0" y="64" width="240" height="104" rx="12" fill="#ffffff" stroke="#1f5f99" stroke-width="2.5"/>
<text x="730.0" y="110.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="730.0" dy="0">有就加通行密鑰，</tspan><tspan x="730.0" dy="26.0">沒有就加驗證器</tspan></text>
<text x="30.0" y="222" font-size="22" font-weight="700" fill="#b3261e">再拆舊的</text>
<rect x="30.0" y="238" width="240" height="104" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="150.0" y="297.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="150.0" dy="0">先備好其他登入方式</tspan></text>
<line x1="274.0" y1="290.0" x2="316.0" y2="290.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="320.0" y="238" width="240" height="104" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="440.0" y="297.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="440.0" dy="0">再關掉簡訊驗證</tspan></text>
<line x1="564.0" y1="290.0" x2="606.0" y2="290.0" stroke="#5b6470" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="610.0" y="238" width="240" height="104" rx="12" fill="#ffffff" stroke="#b3261e" stroke-width="2.5"/>
<text x="730.0" y="284.0" font-size="20" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="730.0" dy="0">確認帳號救援</tspan><tspan x="730.0" dy="26.0">是否還寄到簡訊</tspan></text>
</svg>