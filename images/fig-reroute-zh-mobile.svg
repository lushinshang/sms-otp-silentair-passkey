<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1220" role="img" aria-labelledby="t d" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
<title id="t">假的位置更新怎麼把簡訊改道</title><desc id="d">上排平常：網站寄出驗證碼，電信網路查這支手機在哪，送到你的手機。下排被攔截時：被入侵的電信設備送出假的位置更新，網路以為手機換了地方，簡訊改送攻擊者控制的路徑。結論：不需要碰到你的手機，被改的是電信網路裡的紀錄。</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/></marker></defs>
<rect width="600" height="1220" rx="14" fill="#f6f3ee"/>
<text x="300.0" y="66" font-size="32" font-weight="700" fill="#5b6470" text-anchor="middle">平常</text>
<rect x="70.0" y="90" width="460" height="120" rx="14" fill="#ffffff" stroke="#5b6470" stroke-width="3"/>
<text x="300.0" y="159.8" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">網站寄出驗證碼</tspan></text>
<line x1="300.0" y1="214" x2="300.0" y2="256" stroke="#5b6470" stroke-width="3" marker-end="url(#ar)"/>
<rect x="70.0" y="260" width="460" height="120" rx="14" fill="#ffffff" stroke="#5b6470" stroke-width="3"/>
<text x="300.0" y="311.6" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">電信網路查</tspan><tspan x="300.0" dy="36.4">這支手機在哪</tspan></text>
<line x1="300.0" y1="384" x2="300.0" y2="426" stroke="#5b6470" stroke-width="3" marker-end="url(#ar)"/>
<rect x="70.0" y="430" width="460" height="120" rx="14" fill="#ffffff" stroke="#5b6470" stroke-width="3"/>
<text x="300.0" y="499.8" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">送到你的手機</tspan></text>
<text x="300.0" y="616" font-size="32" font-weight="700" fill="#b3261e" text-anchor="middle">被攔截時</text>
<rect x="70.0" y="640" width="460" height="120" rx="14" fill="#ffffff" stroke="#b3261e" stroke-width="3"/>
<text x="300.0" y="691.6" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">被入侵的電信設備</tspan><tspan x="300.0" dy="36.4">送出假的位置更新</tspan></text>
<line x1="300.0" y1="764" x2="300.0" y2="806" stroke="#5b6470" stroke-width="3" marker-end="url(#ar)"/>
<rect x="70.0" y="810" width="460" height="120" rx="14" fill="#ffffff" stroke="#b3261e" stroke-width="3"/>
<text x="300.0" y="879.8" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">網路以為手機換了地方</tspan></text>
<line x1="300.0" y1="934" x2="300.0" y2="976" stroke="#5b6470" stroke-width="3" marker-end="url(#ar)"/>
<rect x="70.0" y="980" width="460" height="120" rx="14" fill="#ffffff" stroke="#b3261e" stroke-width="3"/>
<text x="300.0" y="1031.6" font-size="28" font-weight="400" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">簡訊改送</tspan><tspan x="300.0" dy="36.4">攻擊者控制的路徑</tspan></text>
<text x="300.0" y="1161.0" font-size="30" font-weight="700" fill="#1f2328" text-anchor="middle"><tspan x="300.0" dy="0">不需要碰到你的手機，</tspan><tspan x="300.0" dy="39.0">被改的是電信網路裡的紀錄</tspan></text>
</svg>